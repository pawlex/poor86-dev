<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 800" width="920" height="800" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <style>
    .board  { fill:#f7f6f3; stroke:#3a3a3a; stroke-width:2.5; }
    .rear   { fill:#e9e5dc; stroke:#9a9384; stroke-width:1; }
    .part   { fill:#ffffff; stroke:#3a3a3a; stroke-width:1.6; }
    .fpga   { fill:#dfe8f0; stroke:#2c4a63; stroke-width:2; }
    .cpu    { fill:#f2e2dc; stroke:#7a4030; stroke-width:2; }
    .mem    { fill:#e3eee1; stroke:#3d6b3a; stroke-width:1.6; }
    .cfg    { fill:#f0e8f3; stroke:#5c3d70; stroke-width:1.6; }
    .conn   { fill:#efeae0; stroke:#6b6355; stroke-width:1.4; }
    .mezz   { fill:#fdf3d8; stroke:#8a6d1f; stroke-width:1.8; }
    .daugh  { fill:#fbfbfb; stroke:#8a8a8a; stroke-width:1.4; stroke-dasharray:6 4; }
    .t      { font-size:13px; fill:#1c1c1c; }
    .tb     { font-size:13.5px; fill:#1c1c1c; font-weight:bold; }
    .ts     { font-size:11px; fill:#4a4a4a; }
    .tt     { font-size:10.5px; fill:#666; font-style:italic; }
    .edge   { font-size:11.5px; fill:#2c4a63; font-weight:bold; }
    .bus    { stroke:#3a3a3a; stroke-width:2.2; fill:none; }
    .busw   { stroke:#7a4030; stroke-width:4; fill:none; }
    .busm   { stroke:#3d6b3a; stroke-width:3.4; fill:none; }
    .title  { font-size:19px; fill:#111; font-weight:bold; }
    .sub    { font-size:12px; fill:#555; }
  </style>

  <text class="title" x="24" y="30">Poor86 — general placement</text>
  <text class="sub" x="24" y="50">Relative placement only. Orientation not fixed. Derived from Data/pinmap_*.csv — see docs/PLACEMENT.md</text>

  <!-- board -->
  <rect class="board" x="150" y="70" width="640" height="640" rx="6"/>
  <text class="ts" x="470" y="730" text-anchor="middle">mini-ITX — 170 × 170 mm</text>
  <!-- mounting holes -->
  <circle cx="172" cy="92" r="6" fill="none" stroke="#9a9384"/>
  <circle cx="768" cy="92" r="6" fill="none" stroke="#9a9384"/>
  <circle cx="172" cy="688" r="6" fill="none" stroke="#9a9384"/>
  <circle cx="768" cy="688" r="6" fill="none" stroke="#9a9384"/>

  <!-- rear I/O band -->
  <rect class="rear" x="150" y="70" width="640" height="62"/>
  <text class="ts" x="162" y="88">REAR I/O  159 × 44.5 mm</text>
  <rect class="conn" x="196" y="96" width="96" height="28" rx="3"/>
  <text class="t" x="244" y="115" text-anchor="middle">power in</text>
  <rect class="conn" x="330" y="96" width="76" height="28" rx="3"/>
  <text class="t" x="368" y="115" text-anchor="middle">USB</text>
  <rect class="conn" x="470" y="96" width="86" height="28" rx="3"/>
  <text class="t" x="513" y="115" text-anchor="middle">HDMI</text>
  <text class="tt" x="600" y="115">ATX vs DC barrel — open (G8)</text>

  <!-- ESP32 -->
  <rect class="part" x="182" y="160" width="120" height="66" rx="3"/>
  <text class="tb" x="242" y="188" text-anchor="middle">ESP32</text>
  <text class="ts" x="242" y="206" text-anchor="middle">controller</text>
  <text class="tt" x="242" y="240" text-anchor="middle">antenna keep-out</text>

  <!-- FPGA -->
  <rect class="fpga" x="396" y="300" width="170" height="170" rx="4"/>
  <text class="tb" x="481" y="372" text-anchor="middle">ECP5</text>
  <text class="t" x="481" y="392" text-anchor="middle">LFE5U-85F</text>
  <text class="ts" x="481" y="410" text-anchor="middle">CABGA381 · 205 PIO</text>
  <text class="edge" x="481" y="318" text-anchor="middle">PT · 60</text>
  <text class="edge" x="481" y="460" text-anchor="middle">PB · 13</text>
  <text class="edge" x="406" y="390" transform="rotate(-90 406 390)" text-anchor="middle">PL · 65</text>
  <text class="edge" x="556" y="390" transform="rotate(90 556 390)" text-anchor="middle">PR · 67</text>

  <!-- CPU -->
  <rect class="cpu" x="622" y="322" width="148" height="126" rx="3"/>
  <text class="tb" x="696" y="360" text-anchor="middle">Am5x86-133</text>
  <text class="t" x="696" y="379" text-anchor="middle">SQFP-208</text>
  <text class="ts" x="696" y="397" text-anchor="middle">3.3 V, soldered</text>
  <text class="tt" x="696" y="422" text-anchor="middle">or SX-class, ~57 pins</text>
  <!-- CPU bus: spans PT and PR -->
  <path class="busw" d="M622 360 H566"/>
  <path class="busw" d="M640 322 V300 H540"/>
  <text class="tb" x="596" y="352" text-anchor="middle" fill="#7a4030">89</text>
  <text class="ts" x="600" y="292" text-anchor="middle">CPU bus spans PT + PR</text>
  <text class="tt" x="700" y="452" text-anchor="middle">97 full · 89 with pin-saver (16 MB)</text>

  <!-- memory -->
  <rect class="mem" x="186" y="300" width="150" height="54" rx="3"/>
  <text class="tb" x="261" y="323" text-anchor="middle">SDR SDRAM</text>
  <text class="ts" x="261" y="341" text-anchor="middle">wide · 40 pins</text>
  <rect class="mem" x="186" y="372" width="150" height="54" rx="3"/>
  <text class="tb" x="261" y="395" text-anchor="middle">HyperRAM</text>
  <text class="ts" x="261" y="413" text-anchor="middle">narrow · 12 pins</text>
  <path class="busm" d="M336 327 H396"/>
  <path class="busm" d="M336 399 H396"/>
  <text class="tb" x="366" y="320" text-anchor="middle" fill="#3d6b3a">52</text>
  <text class="tt" x="261" y="447" text-anchor="middle">both populated — the experiment</text>

  <!-- config bank -->
  <rect class="cfg" x="392" y="524" width="178" height="62" rx="3"/>
  <text class="tb" x="481" y="547" text-anchor="middle">SPI NOR + QSPI PSRAM</text>
  <text class="ts" x="481" y="565" text-anchor="middle">bank 8 — config &amp; DFx only</text>
  <text class="ts" x="481" y="580" text-anchor="middle">7 of 13 balls</text>
  <path class="bus" d="M481 470 V524"/>

  <!-- HDMI run -->
  <path class="bus" d="M513 300 V124" stroke-dasharray="5 3"/>
  <text class="tb" x="530" y="240" fill="#2c4a63">8</text>
  <text class="ts" x="540" y="258">4 diff pairs</text>
  <text class="tt" x="540" y="274">from PT slack</text>

  <!-- SD -->
  <rect class="part" x="196" y="524" width="120" height="52" rx="3"/>
  <text class="tb" x="256" y="546" text-anchor="middle">SD card</text>
  <text class="ts" x="256" y="564" text-anchor="middle">6 pins</text>

  <!-- mezzanine -->
  <path class="bus" d="M696 448 V614"/>
  <text class="ts" x="712" y="500">raw 486 bus</text>
  <text class="tt" x="712" y="516">unbuffered on baseboard</text>
  <rect class="mezz" x="196" y="614" width="574" height="52" rx="3"/>
  <text class="tb" x="483" y="636" text-anchor="middle">MEZZANINE CONNECTOR — raw 486 bus</text>
  <text class="ts" x="483" y="654" text-anchor="middle">replicated bus + 4 transceiver-control lines · no extra FPGA pins</text>

  <!-- daughterboard -->
  <rect class="daugh" x="260" y="694" width="460" height="60" rx="4"/>
  <text class="t" x="490" y="714" text-anchor="middle">daughterboard — bus transceivers · CL-GD5428 · own DRAM · VGA</text>
  <text class="tt" x="490" y="731" text-anchor="middle">transceivers and level translation live HERE, not on the baseboard</text>
  <text class="tt" x="490" y="746" text-anchor="middle">off the critical path; own schedule; own voltage domain</text>

  <!-- budget panel -->
  <text class="tb" x="24" y="470">pin budget</text>
  <text class="ts" x="24" y="492">CPU bus (pin-saver)   89</text>
  <text class="ts" x="24" y="510">SDRAM                 40</text>
  <text class="ts" x="24" y="528">HyperRAM              12</text>
  <text class="ts" x="24" y="546">HDMI                   8</text>
  <text class="ts" x="24" y="564">NOR + PSRAM CS         7</text>
  <text class="ts" x="24" y="582">SD                     6</text>
  <text class="ts" x="24" y="600">ESP32                  8</text>
  <text class="ts" x="24" y="618">xcvr control (to mezz)  4</text>
  <text class="ts" x="24" y="636">clocks / misc          8</text>
  <line x1="24" y1="646" x2="132" y2="646" stroke="#999"/>
  <text class="tb" x="24" y="664">total            182</text>
  <text class="ts" x="24" y="682">available        205</text>
  <text class="tb" x="24" y="700">spare             23</text>
</svg>
